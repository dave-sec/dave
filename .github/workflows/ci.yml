name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - run: dave compose tests/fixtures/secure-compose.yml && dave fix tests/fixtures/insecure-compose.yml

  debian:
    name: Debian ${{ matrix.debian }} (.deb)
    runs-on: ubuntu-latest
    container: debian:${{ matrix.debian }}
    strategy:
      fail-fast: false
      matrix:
        debian: ["11", "12", "13"]
    steps:
      - run: apt-get update -qq && apt-get install -y -qq python3 python3-yaml git dpkg-dev ca-certificates >/dev/null
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: ./packaging/build-deb.sh
      - run: apt-get install -y ./dist/dave_*_all.deb
      - run: dave --version && dave compose tests/fixtures/secure-compose.yml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dave:test .
      - run: docker run --rm -v "$PWD/tests/fixtures:/f:ro" dave:test compose /f/secure-compose.yml
