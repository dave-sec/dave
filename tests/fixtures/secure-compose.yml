services:
  ollama:
    image: ollama/ollama:0.12.3
    user: "1000:1000"
    ports:
      - "127.0.0.1:11434:11434"
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.6.30
    user: "1000:1000"
    ports:
      - target: 8080
        published: 3000
        host_ip: 127.0.0.1
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
