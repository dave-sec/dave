server {
    listen 443 ssl;
    server_name llm.example.com;
    location / {
        proxy_pass http://ollama:11434;
    }
}
server {
    listen 443 ssl;
    server_name vec.example.com;
    auth_basic "private";
    auth_basic_user_file /etc/nginx/.htpasswd;
    location / { proxy_pass http://qdrant:6333; }
}
server {
    listen 443 ssl;
    server_name chat.example.com;
    location / { proxy_pass http://open-webui:8080; }
}
