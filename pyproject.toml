[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dave-ai"
version = "0.4.0"
description = "Security audit for self-hosted AI stacks: Ollama, Open WebUI, n8n, LiteLLM and more."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "AGPL-3.0-or-later"}
dependencies = ["PyYAML>=5.1"]
keywords = ["security", "ollama", "open-webui", "self-hosted", "homelab", "llm", "docker", "audit"]
classifiers = [
  "Environment :: Console",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
]

[project.scripts]
dave = "dave.cli:main"

[tool.setuptools]
packages = ["dave"]
